# Defaults apply when settings are omitted. Unknown keys warn; bin/wuwei init --upgrade removes the ones no longer read.
# Running build seats (CAP). 0 derives it at every sweep from free memory and cores; a
# positive number pins it. The [budget] windows below bound it per runtime. Integer counts must not be negative.
cap = 0
profile = "strict" # strict or standard
template_version = "" # Plugin version that last wrote this file; init and init --upgrade set it.
# Add one [[repos]] table per repository, for example:
# [[repos]]
# name = "owner/repo" # GitHub repository name used for merge_deploys matching.
# path = "repos/example" # Relative to the workspace, or an absolute repository path.
# default_branch = "main" # Required for each configured repository.
# identity = {name = "Builder", email = "builder@example.test"} # Commit guards compare commits against it; wuwei worktree add writes it to each item worktree's Git config.
# merge_deploys = false # Explicitly declare that merges do not deploy.
# fast_checks = ["python3 -m pytest -q"] # Run and record with wuwei build check <item>.
# [repos.merge]
# auto = false # Enable only after review, check, soak and path rules are configured.
# size_exclude = ["results/*.json"] # Generated files max_changed_lines does not count; never-auto paths still apply.
# [repos.shepherd]
# reviewers = ["reviewer"] # Replaces shepherd.reviewers for this repository.

# Interpreter for a fast check like .venv/bin/python, in fresh worktrees.
# [checks]
# python = ".venv/bin/python" # Absolute or relative to the repository; wins in every worktree.
# bootstrap = "python3 -m venv .venv && .venv/bin/python -m pip install -q -e ." # Runs once per new worktree.

[prioritisation]
framework = "wsjf" # wsjf or rice

[tracker]
backlog_filter = "" # Optional Linear team ID; empty reads accessible issues.
# create = ["bugs", "triage", "follow-ups"] # Ticket classes seats may open besides items.
# log = ["decisions", "progress", "verdicts", "pr", "close"] # Comment kinds tracker log writes; the PR link and merged note are the in_review and done duties.
# max_per_item_per_day = 10 # Comments per ticket per day; the last one folds the rest.
# project = "" # Linear team, Jira project key or GitHub owner/repo for new tickets.
# board = "" # GitHub Projects board as owner/number; empty uses labels.
# auth = "token" # GitHub: "gh" uses your gh login when GITHUB_TRACKER_TOKEN is unset.
[tracker.states]
in_review = "In Review"
done = "Done"

[owner]
name = ""
pronouns = ""
handles = [] # Bare chat IDs and code-host handles, e.g. "U12345", "pat-dev".
# timezone = "Europe/Amsterdam" # IANA zone for quality hour bands; empty is this machine's zone.
[owner.verbosity]
default = "brief" # brief, standard or full: how much cards and the report say to you.
# report = "" # The report alone; empty uses default.

[host]
free_memory_mb = 1024 # Nonnegative free-memory floor in MiB.
min_free_memory_pct = 0 # Hold new seat launches while the host has less than this percent free; 0 is off.
seats = 0 # 0 derives the seat ceiling from free memory and cores; a number pins it.
reservation_timeout_seconds = 14400 # Report stale reservations; never silently release them.
rate_limit_wait_seconds = 120 # Wait this long at most for a GitHub rate limit to reset, then retry once; 0 never waits.

# Input plus output tokens per usage window; with the per-seat cost they bound each runtime's
# seats, and next waits for the window's reset. 0 is no budget.
# [budget.claude]
# five_hour = 0
# seven_day = 0
# [budget.codex]
# five_hour = 0
# seven_day = 0

[memory]
budget_tokens = 6000 # SessionStart memory payload budget; today is left out first.
export_to = "CLAUDE.md" # Workspace-relative file that receives the generated rules block.

[retro]
charter_paths = [".wuwei/charters"]
changelog = ".wuwei/memory/CHANGELOG.md"

[metrics]
transcripts = "~/.claude/projects" # Claude Code project transcripts for this workspace.
band_margin = 0.2 # FIX-rate lead a band needs over every other band before the retro names it.

[build]
max_iterations = 8
stuck_after = 3
poll_interval_seconds = 5
poll_timeout_seconds = 3600

[codex]
command = [] # Set to the companion command, for example ["node", "path/to/codex-companion.mjs"].
timeout_seconds = 300

[gates]
# For STANDARD and FULL items, run one gate again on another runtime, for example "codex:<model>".
# second_opinion = "off"
# second_opinion_role = "quality"
# second_opinion_when = [] # item flags that select it, for example ["trust_surface", "agent_surface"]; empty is every standard and full item
# max_rounds = 2 # Fix rounds per item; after the cap notes ship in the PR and a blocker parks.
# tier_max_rounds = { light = 0, standard = 0, full = 0 } # 0 uses max_rounds.
# polish = "offer" # never, offer or always: one notes-only round after a pass.

[adapters]
tracker = "none"
chat = "none"
review_bot = "none"
runtime = "claude"
scanner = "none" # none or ziran; agent_surface gates require a compatible JSON CLI.
code_host = "github"
vcs = "git"
host = "local"
checks = "local"
transcripts = "none"

[scanner]
severity_threshold = "high" # critical, high, medium or low; trust-boundary findings always block.

[scanner.mcp]
# Installed plugin registry v2, read to find installed plugins.
plugins_file = "~/.claude/plugins/installed_plugins.json"

[brief]
remote = "origin"
prior_branch_pattern = "*{item}*" # Item is lowercased.
full_path_patterns = [] # Owner-supplied regexes. Example: '(^|/)(infra|infrastructure|terraform|migrations?|secrets?)(/|$)'

# Registers map names to descriptions.
[boundary]
# api = "Public HTTP interface"
[environments]
# production = "Live branch"
# "release/*" = "Release branches"

[deploy]
workflows = [] # Deploying workflow names, filenames, paths or IDs.
deny = [] # Literal executable plus argument glob, for example "make publish*".

[outward]
# Exact MCP tool names that may send to other people. An unlisted write is refused, naming the
# bin/wuwei config set outward.allow '["<tool>"]' --add line, which asks your Owner step card.
# A write whose every destination is your own surface (outbound.owner) never needs it.
allow = []
# banned_characters = ["emoji", "\u2014", "\u2015", "\u2e3a", "\u2e3b"] # [] disables character bans.
# Tool patterns full-match names and select the lint channel. Setting the array
# here replaces the defaults; bin/wuwei config set --add adds to them.
# tool_patterns = [{pattern = 'mcp__custom__send', channel = 'customer'}]
# humanize = true # AI-tell lint on outward text (charters/_common-authoring.md).
# humanize_kinds = ["dm", "tracker", "docs", "pr", "review"] # Kinds the lint checks.
# humanize_strict = false # true refuses a text with a tell instead of warning.
# Server alias (slack, tracker, code_host, docs, mail, other or local), checked first; local
# servers act only on your machine.
# [outward.servers]
# "<server id>" = "slack"
[outward.max_length]
# slack = 4000 # Positive maximum length for this channel.

[outbound]
code_host_orgs = []
# Your own identity per surface; a write whose every destination is yours is local, never an
# outward send: your Slack DM or user id, your mail, your own canvas and page ids. A refused
# write to a canvas or page names bin/wuwei config set outbound.owner.pages '["<id>"]' --add
# first, for when that canvas or page is your own; it asks your Owner step card.
# owner = {slack = {user = "U123", dm = "D123"}, mail = "you@example.test", code_host = "your-login", pages = ["F123", "<notion page id>"]}
# Where the planner posts the day report: "session" or "dm" (your own Slack DM).
# owner_channel = "dm"

[duties]
# Outward duties wuwei next lists until each is recorded, each while its channel is configured:
# ping (shepherd.review_channel: post the review request once a PR is raised), shepherd (a code
# host: answer new review threads), tracker (a tracker or an owner page: update it once merged),
# summary (outbound.owner_channel = "dm": post the day summary once the report is written).
# Remove a name to turn that duty off.
on = ["ping", "shepherd", "tracker", "summary"]

[pr]
poll_seconds = 120
action_minutes = 30
review_window = 120

[shepherd]
lead_login = "" # Code host login of the lead; eligible when different from the PR author.
reviewers = [] # Code host logins requested instead of the history ranking and the lead.
reviewers_exclude = [] # Code host logins never picked from history, the lead included.
review_channel = "" # Chat channel ID for review requests.
review_gate_check = "Review Gate" # Check excluded while requesting reviewers.
min_reviewers = 1 # Minimum eligible reviewers, including the lead; 0 is a solo owner who merges without a reviewer. A repository with no other author raises with no reviewer.
author_windows_days = [90, 180] # Authorship lookback windows before all history.
tie_commits = 2 # Include a third author within this commit count of second place.
source_exclude = ["specs/*", "*.lock", "*lock.json", "*.generated.*", "generated/*"] # Paths excluded from reviewer selection.

[shepherd.authors]
# Map each author email to a verified code host login and chat mention.
# An unmapped email is resolved through the code host; one it cannot resolve is skipped.
# "reviewer@example.test" = {login = "reviewer", mention = "UREVIEWER"}

[spec]
# The spec engine each non-trivial item is specified with before it is built: speckit, superpowers, openspec or none.
engine = "speckit"
# strict: the gates wait until the engine's steps are done. advisory: warn once per item and day. off: no check.
mode = "strict"
# Lead tiers whose items need no spec. The owner overrides one item with wuwei plan set <item> spec=required or spec=skipped --reason <why>.
skip_tiers = ["light"]

[security]
required = true

[guards]
enforce = true # false logs what the guards would refuse and lets the call through; records, merges, deploys and held sends still refuse. init --shadow starts here.

# Weekly usage counts (design 5.13). share: "anonymous", "attributed" or "off"; empty means
# not asked yet and sends nothing. bin/wuwei telemetry preview prints exactly what would leave.
# [telemetry]
# enabled = true
# share = ""
# endpoint = "" # Where anonymous mode posts; empty or not https keeps every week local.
# repository = "taoq-ai/wuwei" # Where attributed mode opens issues.
# Your own OpenTelemetry platform, set only by you with bin/wuwei config set.
# [telemetry.otlp]
# endpoint = "" # https OTLP/HTTP base URL
# headers_env = "" # Name of the .wuwei/env variable holding key=value,key=value auth headers.
