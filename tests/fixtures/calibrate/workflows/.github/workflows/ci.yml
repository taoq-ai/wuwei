name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Not a job name
        run: make lint
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - run: make test
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: make bench
