name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux keeps the names branch protection requires (test (3.11), test (3.12)); macOS and Windows name their OS.
    name: ${{ matrix.os == 'ubuntu-latest' && format('test ({0})', matrix.python-version) || format('test ({0}, {1})', matrix.os, matrix.python-version) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q --junitxml=pytest.xml -o faulthandler_timeout=300 2>&1 | tee pytest.log  # bash -o pipefail keeps the pytest result
        shell: bash
      # Each failure as an annotation, so the PR and the checks API show which test failed on which OS.
      - if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os, re, sys, xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding='utf-8')
          def say(text, level='error'):  # GitHub keeps 10 annotations of each level per step, each up to 4 KB
              print(f'::{level}::' + text[:3800].replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          if not os.path.exists('pytest.xml'):
              say('pytest wrote no report:\n' + open('pytest.log', encoding='utf-8', errors='replace').read()[-3000:])
              sys.exit()
          bad = [(f"{c.get('classname')}.{c.get('name')}", f) for c in ET.parse('pytest.xml').iter('testcase')
                 for f in [*c.iter('failure'), *c.iter('error')]]
          groups = {}  # failures that share a first message line share a cause
          for name, f in bad:
              key = re.sub(r'\S*[\\/]\S*', '<path>', (f.get('message') or '').split('\n')[0])
              groups.setdefault(re.sub(r'[0-9a-f]{6,}|[0-9]+', '#', key)[:120], []).append((name, f))
          ranked = sorted(groups.items(), key=lambda g: -len(g[1]))
          lines = [f'{len(bad)} failed in {len(groups)} groups'] + [f'{len(v)} x {k} (e.g. {v[0][0][:100]})' for k, v in ranked]
          chunks = ['']
          for line in lines:
              chunks[-1:] = [chunks[-1] + line + '\n'] if len(chunks[-1]) + len(line) < 3700 else [chunks[-1], line + '\n']
          for chunk in chunks[:10]:
              say(chunk, 'warning')
          for i, (_, [(name, f), *_]) in enumerate(ranked[:20]):
              say(name[:200] + '\n' + (f.get('message') or '')[:600] + '\n' + (f.text or '')[-2500:], 'error' if i < 10 else 'notice')
          PY
      - run: bin/wuwei agents check
        shell: bash

  ziran-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Audit role grants
        uses: taoq-ai/ziran@v0.41.0
        with:
          command: audit
          path: agents
          baseline: agents/ziran-baseline.json
          severity-threshold: high
          ziran-version: "ziran==0.41.0"
          sarif-output: ziran.sarif
