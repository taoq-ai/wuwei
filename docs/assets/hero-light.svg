<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">WUWEI day loop</title>
<desc id="desc">The WUWEI day is a loop. Plan, the owner's morning gate, leads to Build, where each item is built and checked until its checks pass. Review fans out to architecture, quality and security gates; a FIX verdict sends the item back to Build for one fix round and a delta check. A shepherd moves each pull request through CI, review threads and rebases until it merges, then Close runs the retro. Memory folds the learnings back into charters and notes so tomorrow's Plan starts from them. A sweep adds new work during the day. The owner is touched only at the morning gate, decisions, drafts to send and merges. Guards act at action time around every step.</desc>
<style><![CDATA[
.flow{stroke-dasharray:2 14;animation:flow 2.4s linear infinite}
.slow{animation-duration:4s}
@keyframes flow{to{stroke-dashoffset:-32}}
.ring{animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){.tok,.pulse{display:none}.flow,.ring{animation:none}}
]]></style>
