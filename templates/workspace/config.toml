# Defaults apply when settings are omitted. Unknown keys are errors.
# Running build seats and host limits. Integer counts must be positive.
cap = 1
profile = "strict" # strict or standard
repos = []
# Replace repos = [] with one or more tables like:
# [[repos]]
# name = "owner/repo" # GitHub repository name used for merge_deploys matching.
# path = "repos/example" # Relative to the workspace, or an absolute repository path.
# default_branch = "main" # Required for each configured repository.
# identity = {name = "Builder", email = "builder@example.test"} # Required by Git guards.
# merge_deploys = false # Explicitly declare that merges do not deploy.
# fast_checks = ["python3 -m pytest -q"] # Run and record with wuwei fast-checks <checkout>.

[owner]
name = ""
pronouns = ""
handles = [] # Bare chat IDs and code-host handles, e.g. "U12345", "pat-dev".

[host]
free_memory_mb = 1024 # Nonnegative free-memory floor in MiB.
seats = 1
reservation_timeout_seconds = 14400 # Report stale reservations; never silently release them.

[memory]
max_notes = 60

[adapters]
tracker = "none"
chat = "none"
review_bot = "none"
runtime = "claude"
scanner = "none"
code_host = "github"
vcs = "git"
host = "local"
checks = "local"

[brief]
remote = "origin"
prior_branch_pattern = "*{item}*" # Item is lowercased.
full_path_patterns = [] # Owner-supplied regexes. Example: '(^|/)(infra|infrastructure|terraform|migrations?|secrets?)(/|$)'

# Registers map names to descriptions.
[boundary]
# api = "Public HTTP interface"
[environments]
# production = "Live branch"
# "release/*" = "Release branches"

[deploy]
workflows = [] # Deploying workflow names, filenames, paths or IDs.
deny = [] # Literal executable plus argument glob, for example "make publish*".

[outward]
# Defaults block pending drafts, queues, agent/seat references and routine internals.
# patterns = ['\binternal phrase\b'] # Replaces defaults; [] disables patterns.
# banned_characters = ["emoji", "\u2014", "\u2015", "\u2e3a", "\u2e3b"] # [] disables character bans.
# Tool patterns full-match names and select a policy channel. Setting the array
# replaces defaults for Slack, Linear and GitHub MCP writes.
# Adapter ports enforce the same policy independently of these patterns.
# tool_patterns = [{pattern = 'mcp__custom__send', channel = 'customer'}]
# Register every outward write tool used by this workspace. Unsupported payload
# shapes fail closed. See specs/011-outward-lint/contracts/outward.md.
[outward.max_length]
# slack = 4000 # Positive maximum length for this channel.

[outbound]
# Only these internal channel IDs may auto-send routine work replies.
# Missing/unknown destinations draft. Every DM drafts, even an acknowledgement.
# Chat threads draft until the chat port can verify all participants; tracker writes draft.
work_channels = []
# Shared, connected and client channels override work_channels.
external_channels = []
# Exact, case-insensitive identity boundaries; subdomains must be listed explicitly.
company_domains = []
code_host_orgs = []
# People keys use slack:<id>, github:<login>, or email:<address> namespaces.
# Unknown addressed people or PR participants draft. Any external identity wins.
# people = {"slack:U123" = {email = "dev@example.test"}, "github:developer" = {org = "example"}}
# Team PRs also require a configured repos.name, a known internal author and
# internal discussion participants, verified through the code_host port.
# GitHub identities require the PR's org; email alone cannot vouch for a login.
# The auto-send allowlist is the ceiling; keyword lists are defence in depth.
# These lists replace their defaults. Keep them conservative.
# sensitive_keywords = ["performance", "feedback", "compensation", "salary", "pay", "bonus", "hiring", "interview", "firing", "personal", "health", "medical", "conflict", "legal", "hr", "harassment", "promotion", "illness"]
# sensitive_patterns = ['\bmental\s+health\b']
# commitment_patterns = ["\\b(?:i|we)\\s*(?:['\\u2019]ll|will|shall|can|promise|commit)\\b", "\\b(?:by|before|after)\\s+(?:\\w+day|tomorrow|noon|\\d)", "\\b(?:follow[ -]?up|deadline|out of scope|next (?:week|sprint))\\b"]
# disagreement_patterns = ["\\bdisagree\\b", "\\b(?:you|that)\\s*(?:are|['\\u2019]re|is)\\s+wrong\\b", "\\b(?:i|we)\\s+(?:object|oppose)\\b"]
# See specs/095-outbound-tiers/contracts/outbound.md for payloads and safe forms.
