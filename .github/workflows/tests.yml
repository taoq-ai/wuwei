name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - run: python -m pytest -q

  ziran-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Audit role grants
        uses: taoq-ai/ziran@v0.40.0
        with:
          command: audit
          path: agents
          baseline: agents/ziran-baseline.json
          severity-threshold: high
          ziran-version: "ziran==0.40.0"
      - name: Verify baseline and widening detection
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_ziran_ci_audit.py

  latency:
    # Measures the hook budgets on the quiet runner every push. Informational: it never blocks a merge.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WUWEI_BENCH: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - run: python -m pytest -q tests/test_hooks.py -k latency

  skill-evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without credentials
        if: env.ANTHROPIC_API_KEY == ''
        run: echo 'ANTHROPIC_API_KEY is not set; skipping skill evals'
      - name: Skip on pull requests
        if: env.ANTHROPIC_API_KEY != '' && github.event_name != 'push'
        run: echo 'Skill evals run only on pushes to main; skipping pull request'
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run skill evals
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        run: claude plugin eval . --trust-plugin --ablation none --threshold 0.9 --json skill-evals.json

  headless-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without credentials
        if: env.ANTHROPIC_API_KEY == ''
        run: echo 'ANTHROPIC_API_KEY is not set; skipping headless e2e'
      - name: Skip on pull requests
        if: env.ANTHROPIC_API_KEY != '' && github.event_name != 'push'
        run: echo 'Headless e2e runs only on pushes to main; skipping pull request'
      - uses: actions/setup-python@v7
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        with:
          python-version: '3.11'
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        run: |
          set -o pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run real headless day
        if: env.ANTHROPIC_API_KEY != '' && github.event_name == 'push'
        run: python scripts/headless_e2e.py
