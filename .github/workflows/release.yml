name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT lets release PRs trigger Tests; GITHUB_TOKEN does not.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  signed-artifact:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and sign complete plugin inventory
        env:
          WUWEI_MANIFEST_SIGNING_KEY: ${{ secrets.WUWEI_MANIFEST_SIGNING_KEY }}
          PYTHONPATH: cli
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_key="$RUNNER_TEMP/wuwei-manifest-key"
          trap 'rm -f "$signing_key"' EXIT
          test -n "$WUWEI_MANIFEST_SIGNING_KEY"
          printf '%s\n' "$WUWEI_MANIFEST_SIGNING_KEY" > "$signing_key"
          unset WUWEI_MANIFEST_SIGNING_KEY
          python3 -P scripts/build-release.py --key "$signing_key" --output release
      - uses: actions/upload-artifact@v4
        with:
          name: wuwei-signed-release
          path: release/wuwei.tar.gz
          if-no-files-found: error
      - name: Attach signed archive to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: release/wuwei.tar.gz
          append_body: true
          body: "Restart Claude Code so only this version's hooks run."
