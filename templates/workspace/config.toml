# Defaults apply when settings are omitted. Unknown keys are errors.
# Running build seats and host limits. Integer counts must be positive.
cap = 1
profile = "strict" # strict or standard
repos = []
# Replace repos = [] with one or more tables like:
# [[repos]]
# name = "example"
# path = "repos/example" # Relative to the workspace, or an absolute repository path.
# default_branch = "main" # Required for each configured repository.
# identity = {name = "Builder", email = "builder@example.test"} # Required by Git guards.
# fast_checks = ["python3 -m pytest -q"] # Run and record with wuwei fast-checks <checkout>.

[owner]
name = ""
pronouns = ""
handles = [] # Bare chat IDs and code-host handles, e.g. "U12345", "pat-dev".

[host]
free_memory_mb = 1024 # Nonnegative free-memory floor in MiB.
seats = 1
reservation_timeout_seconds = 14400 # Report stale reservations; never silently release them.

[memory]
max_notes = 60

[adapters]
tracker = "none"
chat = "none"
review_bot = "none"
runtime = "claude"
scanner = "none"
code_host = "github"
vcs = "git"
host = "local"
checks = "local"

[brief]
remote = "origin"
prior_branch_pattern = "*{item}*" # Item is lowercased.
full_path_patterns = [] # Owner-supplied regexes. Example: '(^|/)(infra|infrastructure|terraform|migrations?|secrets?)(/|$)'

# Registers map names to descriptions.
[boundary]
# api = "Public HTTP interface"
[environments]
# development = "Local machine"

[outward]
# Defaults block pending drafts, queues, agent/seat references and routine internals.
# patterns = ['\binternal phrase\b'] # Replaces defaults; [] disables patterns.
# banned_characters = ["emoji", "\u2014", "\u2015", "\u2e3a", "\u2e3b"] # [] disables character bans.
# Tool patterns full-match names and select a policy channel. Setting the array
# replaces defaults for Slack, Linear and GitHub MCP writes.
# Adapter ports enforce the same policy independently of these patterns.
# tool_patterns = [{pattern = 'mcp__custom__send', channel = 'customer'}]
# Register every outward write tool used by this workspace. Unsupported payload
# shapes fail closed. See specs/011-outward-lint/contracts/outward.md.
[outward.max_length]
# slack = 4000 # Positive maximum length for this channel.
