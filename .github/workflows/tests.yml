name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q --junitxml=pytest.xml 2>&1 | tee pytest.log  # bash -o pipefail keeps the pytest result
        shell: bash
      # Each failure as an annotation, so the PR and the checks API show which test failed on which OS.
      - if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding='utf-8')
          def say(text):
              print('::error::' + text.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          if not os.path.exists('pytest.xml'):
              say('pytest wrote no report:\n' + open('pytest.log', encoding='utf-8', errors='replace').read()[-3000:])
              sys.exit()
          bad = [(f"{c.get('classname')}.{c.get('name')}", f) for c in ET.parse('pytest.xml').iter('testcase')
                 for f in [*c.iter('failure'), *c.iter('error')]]
          say(f'{len(bad)} failed:\n' + '\n'.join(name for name, _ in bad))
          for name, f in bad[:9]:
              say(name + '\n' + (f.get('message') or '') + '\n' + (f.text or '')[-1500:])
          PY
      - run: bin/wuwei agents check
        shell: bash

  ziran-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Audit role grants
        uses: taoq-ai/ziran@v0.41.0
        with:
          command: audit
          path: agents
          baseline: agents/ziran-baseline.json
          severity-threshold: high
          ziran-version: "ziran==0.41.0"
          sarif-output: ziran.sarif
